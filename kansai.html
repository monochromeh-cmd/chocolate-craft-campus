<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kansai | Chocolate Craft Campus</title>

    <style>

        /* =========================
           ページ全体
        ========================= */

        body {
            margin: 0;
            background-color: #2b1a14;
        }


        /* =========================
           関西ページ
        ========================= */

        .kansai-screen {
            width: 70%;
            margin: 0 auto;
            position: relative;
        }


        /* =========================
           関西ページ画像
        ========================= */

        .kansai-screen img {
            width: 100%;
            height: auto;
            display: block;
        }


        /* =========================
           カカオティエゴカン
           透明クリックエリア
        ========================= */

        .cacaotier-link {
            position: absolute;

            left: 19%;
            top: 35%;
            width: 30%;
            height: 12%;

            display: block;
            z-index: 5;

            background: transparent;

            cursor: pointer;
        }


        /* =========================
           ポップアップ背景
        ========================= */

        .modal {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.78);

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 100;
        }


        /* =========================
           ポップアップ表示
        ========================= */

        .modal.show {
            display: flex;
        }


        /* =========================
           店舗詳細ポップアップ
        ========================= */

        .modal-content {
            position: relative;

            width: 90%;
            max-width: 1400px;

            max-height: 90vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           店舗詳細画像
        ========================= */

        .modal-content picture {
            display: block;
            width: 100%;
        }

        .modal-content img {
            width: 100%;
            height: auto;

            max-height: 90vh;

            object-fit: contain;

            display: block;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.7);
        }


        /* =========================
           閉じるボタン
        ========================= */

        .close-button {
            position: absolute;

            top: -20px;
            right: -20px;

            width: 45px;
            height: 45px;

            border: 1px solid #d8b56a;

            border-radius: 50%;

            background-color: #2b1a14;

            color: #f5e8c8;

            font-size: 28px;

            line-height: 40px;

            text-align: center;

            cursor: pointer;

            z-index: 110;
        }


        .close-button:hover {
            background-color: #4a2c1f;
        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 768px) {

            .kansai-screen {
                width: 100%;
            }


            /* スマホ用クリックエリア */

            .cacaotier-link {
                left: 12%;
                top: 38%;
                width: 36%;
                height: 8%;
            }


            /* ポップアップ */

            .modal-content {
                width: 92%;
                max-height: 85vh;
            }


            .modal-content img {
                max-height: 85vh;
            }


            /* 閉じるボタン */

            .close-button {
                top: -15px;
                right: -10px;

                width: 40px;
                height: 40px;

                font-size: 24px;

                line-height: 36px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         関西エリア
    ========================= -->

    <div class="kansai-screen">

        <picture>

            <!-- スマホ用 -->

            <source
                media="(max-width: 768px)"
                srcset="skansai.png">

            <!-- PC用 -->

            <img
                src="kansai.png"
                alt="Chocolate Shop Directory 関西エリア">

        </picture>


        <!-- =========================
             カカオティエゴカン
             透明リンク
        ========================= -->

        <a
            href="#"
            class="cacaotier-link"
            id="cacaotierLink"
            aria-label="カカオティエゴカンの詳細を見る">
        </a>

    </div>



    <!-- =========================
         店舗詳細ポップアップ
    ========================= -->

    <div
        class="modal"
        id="cacaotierModal">

        <div class="modal-content">

            <!-- 閉じるボタン -->

            <button
                class="close-button"
                id="closeButton"
                aria-label="閉じる">
                ×
            </button>


            <!-- =========================
                 店舗詳細画像
            ========================= -->

            <picture>

                <!-- スマホ用 -->

                <source
                    media="(max-width: 768px)"
                    srcset="stenpo002.png">

                <!-- PC用 -->

                <img
                    src="tenpo002.png"
                    alt="カカオティエゴカン 店舗詳細">

            </picture>

        </div>

    </div>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        const cacaotierLink =
            document.getElementById("cacaotierLink");

        const cacaotierModal =
            document.getElementById("cacaotierModal");

        const closeButton =
            document.getElementById("closeButton");


        /* =========================
           店舗カードをクリック
        ========================= */

        cacaotierLink.addEventListener("click", function(event) {

            event.preventDefault();

            cacaotierModal.classList.add("show");

        });


        /* =========================
           ×ボタンで閉じる
        ========================= */

        closeButton.addEventListener("click", function() {

            cacaotierModal.classList.remove("show");

        });


        /* =========================
           背景クリックで閉じる
        ========================= */

        cacaotierModal.addEventListener("click", function(event) {

            if (event.target === cacaotierModal) {

                cacaotierModal.classList.remove("show");

            }

        });


        /* =========================
           ESCキーで閉じる
        ========================= */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                cacaotierModal.classList.remove("show");

            }

        });

    </script>


</body>

</html>

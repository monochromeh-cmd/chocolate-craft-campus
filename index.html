
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chocolate Craft Campus</title>

<style>

/* =========================
   全体
========================= */

body {
    margin: 0;
    background-color: #2b1a14;
}


/* =========================
   TOP画像・扉
========================= */

.hero-door {
    position: relative;
    width: 70%;
    aspect-ratio: 3 / 2;
    margin: 0 auto;
    overflow: hidden;
    cursor: pointer;
    z-index: 2;
}

.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;

    background-image: url("hero.png");
    background-size: 200% 100%;
    background-repeat: no-repeat;

    transition: transform 1s ease;
}

.door-left {
    left: 0;
    background-position: left center;
}

.door-right {
    right: 0;
    background-position: right center;
}


/* =========================
   扉が開く
========================= */

.hero-door.open .door-left {
    transform: translateX(-110%);
}

.hero-door.open .door-right {
    transform: translateX(110%);
}


/* =========================
   カテゴリー画面・世界画面 共通
========================= */

.category-screen,
.world-screen {
    position: absolute;
    top: 0;
    left: 50%;

    width: 70%;

    background-color: #1c120e;

    transform: translateX(-50%);
}

.category-screen {
    z-index: 1;
}

.world-screen {
    display: none;
    z-index: 3;
}


/* 画像 */

.category-screen picture,
.world-screen picture {
    display: block;
}

.category-screen img,
.world-screen img {
    width: 100%;
    height: auto;
    display: block;
}


/* =========================
   画像上のクリック領域
========================= */

.category-link {
    position: absolute;
    display: block;
    z-index: 5;
    background: transparent;
}


/* チョコレート店舗紹介 */

.shop-link {
    left: 2.9%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* チョコレートの世界 */

.world-link {
    left: 22.1%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* =========================
   スマートフォン
========================= */

@media (max-width: 768px) {

    .hero-door {
        width: 100%;
        aspect-ratio: 832 / 1792;
    }

    .door {
        background-image: url("shero.png");
    }

    .category-screen,
    .world-screen {
        width: 100%;
    }

    /* 店舗紹介 */

    .shop-link {
        left: 5%;
        top: 28.8%;
        width: 90%;
        height: 12.4%;
    }

    /* チョコレートの世界 */

    .world-link {
        left: 5%;
        top: 41.8%;
        width: 90%;
        height: 12.4%;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOP画像
========================= -->

<div class="hero-door" id="heroDoor">

    <div class="door door-left"></div>

    <div class="door door-right"></div>

</div>


<!-- =========================
     メインカテゴリー画面
========================= -->

<div class="category-screen" id="categoryScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="scategory.png">

        <img
            src="category.png"
            alt="Chocolate Craft Campus カテゴリー">

    </picture>


    <!-- チョコレート店舗紹介 -->

    <a
        href="shop.html"
        class="category-link shop-link"
        aria-label="チョコレート店舗紹介">
    </a>


    <!-- チョコレートの世界 -->

    <a
        href="#"
        class="category-link world-link"
        id="worldLink"
        aria-label="チョコレートの世界">
    </a>

</div>


<!-- =========================
     チョコレートの世界
========================= -->

<div class="world-screen" id="worldScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="sworld.png">

        <img
            src="world.png"
            alt="The World of Chocolate チョコレートの世界">

    </picture>

</div>


<!-- =========================
     JavaScript
========================= -->

<script>

const heroDoor = document.getElementById("heroDoor");

const categoryScreen =
    document.getElementById("categoryScreen");

const worldScreen =
    document.getElementById("worldScreen");

const worldLink =
    document.getElementById("worldLink");


/* TOP画像をクリックすると扉が開く */

heroDoor.addEventListener("click", function() {

    heroDoor.classList.add("open");

    setTimeout(function() {

        heroDoor.style.pointerEvents = "none";
        heroDoor.style.zIndex = "0";

    }, 300);

});


/* チョコレートの世界をクリック */

worldLink.addEventListener("click", function(event) {

    event.preventDefault();

    /* メインカテゴリーを隠す */

    categoryScreen.style.display = "none";

    /* チョコレートの世界を表示 */

    worldScreen.style.display = "block";

});


</script>


</body>
</html>

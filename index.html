
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chocolate Craft Campus</title>

<style>

/* =========================
   全体
========================= */

body {
    margin: 0;
    background-color: #2b1a14;
}


/* =========================
   TOP画像・扉
========================= */

.hero-door {
    position: relative;
    width: 70%;
    aspect-ratio: 3 / 2;
    margin: 0 auto;
    overflow: hidden;
    cursor: pointer;
    z-index: 2;
}

.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;

    background-image: url("hero.png");
    background-size: 200% 100%;
    background-repeat: no-repeat;

    transition: transform 1s ease;
}

.door-left {
    left: 0;
    background-position: left center;
}

.door-right {
    right: 0;
    background-position: right center;
}


/* =========================
   扉が開く
========================= */

.hero-door.open .door-left {
    transform: translateX(-110%);
}

.hero-door.open .door-right {
    transform: translateX(110%);
}


/* =========================
   各画面 共通
========================= */

.category-screen,
.world-screen,
.history-screen,
.column-screen {
    position: absolute;
    top: 0;
    left: 50%;

    width: 70%;

    background-color: #1c120e;

    transform: translateX(-50%);
}


/* メインカテゴリー */

.category-screen {
    z-index: 1;
}


/* 各カテゴリーの詳細画面 */

.world-screen,
.history-screen,
.column-screen {
    display: none;
    z-index: 3;
}


/* =========================
   画像表示
========================= */

.category-screen picture,
.world-screen picture,
.history-screen picture,
.column-screen picture {
    display: block;
}

.category-screen img,
.world-screen img,
.history-screen img,
.column-screen img {
    width: 100%;
    height: auto;
    display: block;
}


/* =========================
   画像上のクリック領域
========================= */

.category-link {
    position: absolute;
    display: block;
    z-index: 5;
    background: transparent;
}


/* =========================
   PC用 クリック位置
========================= */

/* チョコレート店舗紹介 */

.shop-link {
    left: 2.9%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* チョコレートの世界 */

.world-link {
    left: 22.1%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* チョコレートの歴史 */

.history-link {
    left: 41.1%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* チョコレートコラム */

.column-link {
    left: 60.3%;
    top: 29.1%;
    width: 17.8%;
    height: 59%;
}


/* =========================
   スマートフォン
========================= */

@media (max-width: 768px) {

    /* TOP画像 */

    .hero-door {
        width: 100%;
        aspect-ratio: 832 / 1792;
    }

    .door {
        background-image: url("shero.png");
    }


    /* 各画面 */

    .category-screen,
    .world-screen,
    .history-screen,
    .column-screen {
        width: 100%;
    }


    /* チョコレート店舗紹介 */

    .shop-link {
        left: 5%;
        top: 28.8%;
        width: 90%;
        height: 12.4%;
    }


    /* チョコレートの世界 */

    .world-link {
        left: 5%;
        top: 41.8%;
        width: 90%;
        height: 12.4%;
    }


    /* チョコレートの歴史 */

    .history-link {
        left: 5%;
        top: 54.8%;
        width: 90%;
        height: 12.4%;
    }


    /* チョコレートコラム */

    .column-link {
        left: 5%;
        top: 67.8%;
        width: 90%;
        height: 12.4%;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOP画像
========================= -->

<div class="hero-door" id="heroDoor">

    <div class="door door-left"></div>

    <div class="door door-right"></div>

</div>


<!-- =========================
     メインカテゴリー画面
========================= -->

<div class="category-screen" id="categoryScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="scategory.png">

        <img
            src="category.png"
            alt="Chocolate Craft Campus カテゴリー">

    </picture>


    <!-- チョコレート店舗紹介 -->

    <a
        href="shop.html"
        class="category-link shop-link"
        aria-label="チョコレート店舗紹介">
    </a>


    <!-- チョコレートの世界 -->

    <a
        href="#"
        class="category-link world-link"
        id="worldLink"
        aria-label="チョコレートの世界">
    </a>


    <!-- チョコレートの歴史 -->

    <a
        href="#"
        class="category-link history-link"
        id="historyLink"
        aria-label="チョコレートの歴史">
    </a>


    <!-- チョコレートコラム -->

    <a
        href="#"
        class="category-link column-link"
        id="columnLink"
        aria-label="チョコレートコラム">
    </a>

</div>


<!-- =========================
     チョコレートの世界
========================= -->

<div class="world-screen" id="worldScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="sworld.png">

        <img
            src="world.png"
            alt="The World of Chocolate チョコレートの世界">

    </picture>

</div>


<!-- =========================
     チョコレートの歴史
========================= -->

<div class="history-screen" id="historyScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="shistory.png">

        <img
            src="history.png"
            alt="チョコレートの歴史">

    </picture>

</div>


<!-- =========================
     チョコレートコラム
========================= -->

<div class="column-screen" id="columnScreen">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="scolumn.png">

        <img
            src="column.png"
            alt="Chocolate Column チョコレートコラム">

    </picture>

</div>


<!-- =========================
     JavaScript
========================= -->

<script>

/* =========================
   各画面の取得
========================= */

const heroDoor =
    document.getElementById("heroDoor");

const categoryScreen =
    document.getElementById("categoryScreen");

const worldScreen =
    document.getElementById("worldScreen");

const historyScreen =
    document.getElementById("historyScreen");

const columnScreen =
    document.getElementById("columnScreen");

const worldLink =
    document.getElementById("worldLink");

const historyLink =
    document.getElementById("historyLink");

const columnLink =
    document.getElementById("columnLink");


/* =========================
   TOP画像をクリックすると扉が開く
========================= */

heroDoor.addEventListener("click", function() {

    heroDoor.classList.add("open");

    setTimeout(function() {

        heroDoor.style.pointerEvents = "none";
        heroDoor.style.zIndex = "0";

    }, 300);

});


/* =========================
   詳細画面の切り替え
========================= */

function showDetailScreen(screen) {

    /* メインカテゴリーを隠す */

    categoryScreen.style.display = "none";

    /* すべての詳細画面を隠す */

    worldScreen.style.display = "none";
    historyScreen.style.display = "none";
    columnScreen.style.display = "none";

    /* 選択した画面を表示 */

    screen.style.display = "block";

}


/* =========================
   チョコレートの世界
========================= */

worldLink.addEventListener("click", function(event) {

    event.preventDefault();

    showDetailScreen(worldScreen);

});


/* =========================
   チョコレートの歴史
========================= */

historyLink.addEventListener("click", function(event) {

    event.preventDefault();

    showDetailScreen(historyScreen);

});


/* =========================
   チョコレートコラム
========================= */

columnLink.addEventListener("click", function(event) {

    event.preventDefault();

    showDetailScreen(columnScreen);

});

</script>


</body>
</html>


<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chocolate Craft Campus</title>

    <style>

        /* =========================
           ページ全体
        ========================= */

        body {
            margin: 0;
            background-color: #2b1a14;
        }


        /* =========================
           TOP画像
        ========================= */

        .hero-door {
            position: relative;
            width: 70%;
            aspect-ratio: 3 / 2;
            margin: 0 auto;
            overflow: hidden;
            cursor: pointer;
            z-index: 2;
        }


        /* 左右の扉 */

        .door {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;

            background-image: url("hero.png");
            background-size: 200% 100%;
            background-repeat: no-repeat;

            transition: transform 1s ease;
        }


        /* 左側 */

        .door-left {
            left: 0;
            background-position: left center;
        }


        /* 右側 */

        .door-right {
            right: 0;
            background-position: right center;
        }


        /* =========================
           TOP画像をクリックした後
        ========================= */

        .hero-door.open .door-left {
            transform: translateX(-110%);
        }

        .hero-door.open .door-right {
            transform: translateX(110%);
        }
        
        /* =========================
           スマホ用TOP画像
        ========================= */

        @media (max-width: 768px) {

            .hero-door {
                width: 100%;
                aspect-ratio: 832 / 1792;
            }

            .door {
                background-image: url("shero.png");
            }

        }


        /* =========================
           CATEGORY画面
        ========================= */

        .category-screen {
            position: absolute;
            top: 0;
            left: 50%;

            width: 70%;

            background-color: #1c120e;

            opacity: 1;
            visibility: visible;

            z-index: 1;

            transform: translateX(-50%);
        }


        /* CATEGORY画像 */

        .category-screen picture {
            display: block;
        }

        .category-screen img {
            width: 100%;
            height: auto;
            display: block;
        }


        /* =========================
           店舗紹介への透明リンク
        ========================= */

        .category-link {
            position: absolute;

            display: block;

            z-index: 5;

            background: transparent;
        }


        /* PC：店舗紹介 */

        .shop-link {
            left: 2.9%;
            top: 29.1%;

            width: 17.8%;
            height: 59%;
        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 768px) {

            .category-screen {
                width: 100%;
            }


            /* スマホ：店舗紹介 */

            .shop-link {
                left: 5%;
                top: 28.3%;

                width: 90%;
                height: 11.6%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP画像
    ========================= -->

    <div class="hero-door" id="heroDoor">

        <div class="door door-left"></div>

        <div class="door door-right"></div>

    </div>


    <!-- =========================
         CATEGORY画面
    ========================= -->

    <div class="category-screen" id="categoryScreen">

        <picture>

            <!-- スマホ -->
            <source
                media="(max-width: 768px)"
                srcset="scategory.png">

            <!-- PC -->
            <img
                src="category.png"
                alt="Chocolate Craft Campus カテゴリー">

        </picture>


        <!-- =========================
             店舗紹介への透明リンク
        ========================= -->

        <a
            href="shop.html"
            class="category-link shop-link">
        </a>

    </div>


    <!-- =========================
         JavaScript
    ========================= -->
<script>

    const heroDoor = document.getElementById("heroDoor");

    heroDoor.addEventListener("click", function() {

        /* TOP画像を左右に開く */
        heroDoor.classList.add("open");

        /* 1秒後にTOP画像をクリック対象から外す */
        setTimeout(function() {

            heroDoor.style.pointerEvents = "none";
            heroDoor.style.zIndex = "0";

        }, 1000);

    });

</script>

</body>

</html>

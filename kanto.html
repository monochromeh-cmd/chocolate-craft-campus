<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanto | Chocolate Craft Campus</title>

    <style>

        /* =========================
           ページ全体
        ========================= */

        body {
            margin: 0;
            background-color: #2b1a14;
        }


        /* =========================
           関東ページ
        ========================= */

        .kanto-screen {
            width: 70%;
            margin: 0 auto;
        }


        /* =========================
           画像
        ========================= */

        .kanto-screen img {
            width: 100%;
            height: auto;
            display: block;
        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 768px) {

            .kanto-screen {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         関東エリア
    ========================= -->

    <div class="kanto-screen">

        <picture>

            <!-- スマホ用 -->
            <source
                media="(max-width: 768px)"
                srcset="skanto.png">

            <!-- PC用 -->
            <img
                src="kanto.png"
                alt="Chocolate Shop Directory 関東エリア">

        </picture>

    </div>


</body>

</html>

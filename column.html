
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>チョコレートコラム | Chocolate Craft Campus</title>

<style>

/* =========================
   1. 全体設定
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #2b1a14;
    color: #f8e5b1;
    font-family: "Yu Mincho", "Hiragino Mincho ProN",
                 "Noto Serif JP", serif;
}

/* =========================
   2. 一覧画面
========================= */

.list-screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
}

.list-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
}

.list-stage picture,
.list-stage img {
    display: block;
    width: 100%;
    height: 100%;
}

.list-stage img {
    object-fit: contain;
}

/* =========================
   3. メイン記事のクリック領域
   PC用の画像に合わせた位置
========================= */

.article-link {
    position: absolute;
    left: 4.5%;
    top: 40%;
    width: 68%;
    height: 46%;
    display: block;
    cursor: pointer;
    border: 0;
    background: transparent;
    padding: 0;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
}

.article-link:focus-visible {
    outline: 2px solid #e8c46e;
    outline-offset: -3px;
}

/* =========================
   4. ポップアップ背景
========================= */

.popup {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(20, 10, 6, 0.94);
    overflow: auto;
    padding: 0;
}

.popup.is-open {
    display: flex;
}

/* =========================
   5. ポップアップ画像
========================= */

.popup-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.popup-stage picture {
    display: block;
    width: 100%;
    height: 100%;
}

.popup-stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* =========================
   6. 閉じるボタン
   画像右上の「×」に重ねる
========================= */

.close-button {
    position: absolute;
    top: 0;
    right: 0;
    width: 7%;
    height: 7%;
    min-width: 36px;
    min-height: 36px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 5;
    -webkit-tap-highlight-color: transparent;
}

.close-button:focus-visible {
    outline: 2px solid #e8c46e;
    outline-offset: -3px;
}

/* =========================
   7. スマートフォン表示
========================= */

@media screen and (max-width: 700px) {

    .list-stage {
        width: min(100vw, 51.7857vh);
        aspect-ratio: 928 / 1792;
    }

    /* スマホ用一覧画像のメイン記事位置 */

    .article-link {
        left: 4%;
        top: 19.8%;
        width: 92%;
        height: 42%;
    }

    /* スマホ用ポップアップ画像 */

    .popup-stage {
        width: min(100vw, 66.6667vh);
        aspect-ratio: 2 / 3;
    }

    .close-button {
        width: 9%;
        height: 5%;
        min-width: 32px;
        min-height: 32px;
    }

}

/* =========================
   8. 動きを控えたい環境への配慮
========================= */

@media (prefers-reduced-motion: no-preference) {

    .popup {
        transition: opacity 0.15s ease;
    }

}

</style>
</head>

<body>

<!-- =========================
     コラム一覧画面
========================= -->

<main class="list-screen">

    <div class="list-stage">

        <picture>
            <!-- スマートフォン用一覧画像 -->
            <source
                media="(max-width: 700px)"
                srcset="scolumn.png"
            >

            <!-- PC用一覧画像 -->
            <img
                src="column.png"
                alt="Chocolate Craft Campus チョコレートコラム"
            >
        </picture>

        <!--
          メイン記事のクリック領域。
          クリックするとポップアップを表示します。
        -->

        <button
            class="article-link"
            type="button"
            aria-label="いま注目のカカオポリフェノールを読む"
            aria-haspopup="dialog"
            aria-controls="columnPopup"
            onclick="openColumn()"
        ></button>

    </div>

</main>

<!-- =========================
     コラムのポップアップ
========================= -->

<div
    class="popup"
    id="columnPopup"
    role="dialog"
    aria-modal="true"
    aria-label="いま注目のカカオポリフェノール"
    aria-hidden="true"
>

    <div class="popup-stage">

        <picture>
            <!-- スマートフォン用ポップアップ画像 -->
            <source
                media="(max-width: 700px)"
                srcset="scolumn001.png"
            >

            <!-- PC用ポップアップ画像 -->
            <img
                src="column001.png"
                alt="いま注目のカカオポリフェノール。血管の健康やストレスとの付き合い方について紹介するコラム"
            >
        </picture>

        <!-- 閉じるボタン -->
        <button
            class="close-button"
            type="button"
            aria-label="コラムを閉じる"
            onclick="closeColumn()"
        ></button>

    </div>

</div>

<script>

/* =========================
   ポップアップを開く
========================= */

const popup = document.getElementById("columnPopup");
const articleButton = document.querySelector(".article-link");
const closeButton = document.querySelector(".close-button");

function openColumn() {

    popup.classList.add("is-open");
    popup.setAttribute("aria-hidden", "false");

    document.body.style.overflow = "hidden";

    closeButton.focus();

}

/* =========================
   ポップアップを閉じる
========================= */

function closeColumn() {

    popup.classList.remove("is-open");
    popup.setAttribute("aria-hidden", "true");

    document.body.style.overflow = "";

    articleButton.focus();

}

/* =========================
   Escキーで閉じる
========================= */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Escape" &&
        popup.classList.contains("is-open")
    ) {
        closeColumn();
    }

});

/* =========================
   背景部分をクリックして閉じる
========================= */

popup.addEventListener("click", function(event) {

    if (event.target === popup) {
        closeColumn();
    }

});

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チョコレートコラム | Chocolate Craft Campus</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #2b1a14;
}

/* 一覧画面 */

.list-screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.list-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
}

.list-stage picture,
.list-stage img {
    display: block;
    width: 100%;
    height: 100%;
}

.list-stage img {
    object-fit: contain;
    pointer-events: none;
}

/* 記事のクリック領域 */

.article-link {
    position: absolute;
    z-index: 10;
    left: 4.5%;
    top: 40%;
    width: 68%;
    height: 46%;
    margin: 0;
    padding: 0;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.article-link:hover {
    background: rgba(255, 225, 160, 0.06);
}

.article-link:focus-visible {
    outline: 2px solid #e8c46e;
}

/* ポップアップ */

.popup {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(20, 10, 6, 0.96);
    overflow: auto;
}

.popup.is-open {
    display: flex;
}

.popup-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
}

.popup-stage picture,
.popup-stage img {
    display: block;
    width: 100%;
    height: 100%;
}

.popup-stage img {
    object-fit: contain;
    pointer-events: none;
}

/* 閉じるボタン */

.close-button {
    position: absolute;
    z-index: 20;
    top: 0;
    right: 0;
    width: 8%;
    height: 8%;
    min-width: 40px;
    min-height: 40px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

/* スマートフォン */

@media screen and (max-width: 700px) {

    .list-stage {
        width: min(100vw, 51.7857vh);
        aspect-ratio: 928 / 1792;
    }

    .article-link {
        left: 4%;
        top: 19.8%;
        width: 92%;
        height: 42%;
    }

    .popup-stage {
        width: min(100vw, 66.6667vh);
        aspect-ratio: 2 / 3;
    }

    .close-button {
        width: 10%;
        height: 5%;
        min-width: 34px;
        min-height: 34px;
    }
}
</style>
</head>

<body>

<!-- コラム一覧 -->

<main class="list-screen">
    <div class="list-stage">

        <picture>
            <source
                media="(max-width: 700px)"
                srcset="scolumn.png">

            <img
                src="column.png"
                alt="Chocolate Craft Campus チョコレートコラム">
        </picture>

        <button
            class="article-link"
            id="articleButton"
            type="button"
            aria-label="いま注目のカカオポリフェノールを読む">
        </button>

    </div>
</main>

<!-- コラムポップアップ -->

<div
    class="popup"
    id="columnPopup"
    role="dialog"
    aria-modal="true"
    aria-label="いま注目のカカオポリフェノール"
    aria-hidden="true">

    <div class="popup-stage">

        <picture>
            <source
                media="(max-width: 700px)"
                srcset="scolumn001.png">

            <img
                id="columnDetailImage"
                src="column001.png"
                alt="いま注目のカカオポリフェノール">
        </picture>

        <button
            class="close-button"
            id="closeButton"
            type="button"
            aria-label="コラムを閉じる">
        </button>

    </div>
</div>

<script>
(function () {

    const popup = document.getElementById("columnPopup");
    const articleButton = document.getElementById("articleButton");
    const closeButton = document.getElementById("closeButton");
    const detailImage = document.getElementById("columnDetailImage");

    /* 記事をクリックしたら開く */

    articleButton.addEventListener("click", function () {
        popup.classList.add("is-open");
        popup.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        closeButton.focus();
    });

    /* ×をクリックしたら閉じる */

    function closeColumn() {
        popup.classList.remove("is-open");
        popup.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        articleButton.focus();
    }

    closeButton.addEventListener("click", closeColumn);

    /* 背景クリックで閉じる */

    popup.addEventListener("click", function (event) {
        if (event.target === popup) {
            closeColumn();
        }
    });

    /* Escキーで閉じる */

    document.addEventListener("keydown", function (event) {
        if (
            event.key === "Escape" &&
            popup.classList.contains("is-open")
        ) {
            closeColumn();
        }
    });

    /* 画像が見つからない場合は開発者ツールに記録 */

    detailImage.addEventListener("error", function () {
        console.error(
            "コラム画像を読み込めません。column001.png のファイル名と配置を確認してください。"
        );
    });

})();
</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チョコレートコラム | Chocolate Craft Campus</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #2b1a14;
}

/* =========================
   コラム一覧画面
========================= */

.list-screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.list-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
}

.list-stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* 記事のクリック領域 */

.article-link {
    position: absolute;
    z-index: 10;
    left: 4.5%;
    top: 40%;
    width: 68%;
    height: 46%;
    margin: 0;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.article-link:hover {
    background: rgba(255, 225, 160, 0.06);
}

.article-link:focus-visible {
    outline: 2px solid #e8c46e;
    outline-offset: 2px;
}

/* =========================
   ポップアップ画面
========================= */

.popup {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: none;
    justify-content: center;
    align-items: center;

    padding: 0;
    background: rgba(20, 10, 6, 0.96);
    overflow: auto;
}

.popup.is-open {
    display: flex;
}

.popup-stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    flex-shrink: 0;
}

/* 記事画像 */

.popup-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* 画像が読み込めない場合の表示 */

.popup-error {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 30px;
    color: #fff0d0;
    background: #2b1a14;
    border: 2px solid #d6ad56;
    text-align: center;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.popup-error.is-visible {
    display: flex;
}

/* 閉じるボタン */

.close-button {
    position: absolute;
    z-index: 20;
    top: 0;
    right: 0;
    width: 8%;
    height: 8%;
    min-width: 40px;
    min-height: 40px;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.close-button:focus-visible {
    outline: 2px solid #e8c46e;
}

/* =========================
   スマートフォン
========================= */

@media screen and (max-width: 700px) {

    .list-stage {
        width: min(100vw, 51.7857vh);
        aspect-ratio: 928 / 1792;
    }

    .article-link {
        left: 4%;
        top: 19.8%;
        width: 92%;
        height: 42%;
    }

    .popup-stage {
        width: min(100vw, 66.6667vh);
        aspect-ratio: 2 / 3;
    }

    .close-button {
        width: 10%;
        height: 5%;
        min-width: 34px;
        min-height: 34px;
    }
}
</style>
</head>

<body>

<!-- =========================
     コラム一覧
========================= -->

<main class="list-screen">
    <div class="list-stage">

        <picture>
            <source
                media="(max-width: 700px)"
                srcset="./scolumn.png">

            <img
                src="./column.png"
                alt="Chocolate Craft Campus チョコレートコラム">
        </picture>

        <button
            class="article-link"
            id="articleButton"
            type="button"
            aria-label="いま注目のカカオポリフェノールを読む">
        </button>

    </div>
</main>


<!-- =========================
     コラム記事ポップアップ
========================= -->

<div
    class="popup"
    id="columnPopup"
    role="dialog"
    aria-modal="true"
    aria-label="いま注目のカカオポリフェノール"
    aria-hidden="true">

    <div class="popup-stage">

        <!-- PC・スマホの画像をJavaScriptで切り替え -->

        <img
            class="popup-image"
            id="columnDetailImage"
            src=""
            alt="いま注目のカカオポリフェノール">

        <!-- 画像が見つからない場合の案内 -->

        <div
            class="popup-error"
            id="popupError"
            role="status">
        </div>

        <!-- 閉じるボタン -->

        <button
            class="close-button"
            id="closeButton"
            type="button"
            aria-label="コラムを閉じる">
        </button>

    </div>
</div>


<script>
(function () {

    "use strict";

    const popup = document.getElementById("columnPopup");
    const articleButton = document.getElementById("articleButton");
    const closeButton = document.getElementById("closeButton");
    const detailImage = document.getElementById("columnDetailImage");
    const popupError = document.getElementById("popupError");

    let previousFocus = null;

    /*
       画面サイズに合わせて記事画像を選択
       PC：column001.png
       スマホ：scolumn001.png
    */

    function setArticleImage() {

        const isMobile = window.matchMedia(
            "(max-width: 700px)"
        ).matches;

        const imagePath = isMobile
            ? "./scolumn001.png"
            : "./column001.png";

        popupError.classList.remove("is-visible");
        popupError.textContent = "";

        detailImage.style.display = "block";

        /*
           いったん画像を解除してから読み込み直す
        */

        detailImage.onload = null;
        detailImage.onerror = null;
        detailImage.removeAttribute("src");

        detailImage.onload = function () {
            popupError.classList.remove("is-visible");
            detailImage.style.display = "block";
        };

        detailImage.onerror = function () {

            detailImage.style.display = "none";

            popupError.textContent =
                "記事画像を読み込めませんでした。\n\n" +
                "確認するファイル名：\n" +
                imagePath +
                "\n\n" +
                "GitHub上のファイル名と保存場所を確認してください。";

            popupError.style.whiteSpace = "pre-line";
            popupError.classList.add("is-visible");

            console.error(
                "コラム画像の読み込みに失敗しました:",
                imagePath
            );
        };

        detailImage.src = imagePath;
    }


    /* =========================
       記事をクリックして開く
    ========================= */

    function openColumn() {

        previousFocus = document.activeElement;

        /*
           画像の読み込みとポップアップ表示を
           別々に処理する
        */

        popup.classList.add("is-open");
        popup.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        setArticleImage();

        closeButton.focus();
    }

    articleButton.addEventListener(
        "click",
        openColumn
    );


    /* =========================
       ポップアップを閉じる
    ========================= */

    function closeColumn() {

        popup.classList.remove("is-open");
        popup.setAttribute("aria-hidden", "true");

        document.body.style.overflow = "";

        if (previousFocus) {
            previousFocus.focus();
        } else {
            articleButton.focus();
        }
    }

    closeButton.addEventListener(
        "click",
        closeColumn
    );


    /* 背景をクリックして閉じる */

    popup.addEventListener("click", function (event) {

        if (event.target === popup) {
            closeColumn();
        }

    });


    /* Escキーで閉じる */

    document.addEventListener("keydown", function (event) {

        if (
            event.key === "Escape" &&
            popup.classList.contains("is-open")
        ) {
            closeColumn();
        }

    });


    /* 画像を読み込み中に画面幅が変わった場合も対応 */

    window.matchMedia("(max-width: 700px)")
        .addEventListener("change", function () {

            if (popup.classList.contains("is-open")) {
                setArticleImage();
            }

        });

})();
</script>

</body>
</html>
```

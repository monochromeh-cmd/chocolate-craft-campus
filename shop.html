<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>Chocolate Shop Directory | Chocolate Craft Campus</title>

    <style>

        body {
            margin: 0;
            background-color: #2b1a14;

        .shop-screen {

/* =========================

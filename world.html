
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World of Chocolate｜チョコレートの世界</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #1b0d04;
    }

    .world-page {
      position: relative;
      width: 100%;
      max-width: 1536px;
      margin: 0 auto;
      line-height: 0;
    }

    .world-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* PC版リンク */
    .process-link-pc {
      position: absolute;
      left: 34.9%;
      top: 30.7%;
      width: 30.5%;
      height: 59.0%;
      display: block;
      z-index: 5;
      border-radius: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    /* スマホ版リンクはPCでは非表示 */
    .process-link-sp {
      display: none;
    }

    .process-link-pc:focus-visible,
    .process-link-sp:focus-visible {
      outline: 3px solid #ffcf75;
      outline-offset: 3px;
    }

    /* スマートフォン版 */
    @media (max-width: 700px) {

      .world-page {
        max-width: 100%;
      }

      /* PC版リンクを非表示 */
      .process-link-pc {
        display: none;
      }

      /* スマホ版リンク */
      .process-link-sp {
        position: absolute;
        left: 4.4%;
        top: 46.9%;
        width: 88.8%;
        height: 20.9%;
        display: block;
        z-index: 5;
        border-radius: 14px;
        -webkit-tap-highlight-color: transparent;
      }
    }
  </style>
</head>

<body>

  <main class="world-page">

    <!-- PC版・スマートフォン版の画像切り替え -->
    <picture>
      <source
        media="(max-width: 700px)"
        srcset="sworld.png"
      >

      <img
        class="world-image"
        src="world.png"
        alt="The World of Chocolate"
      >
    </picture>

    <!-- PC版リンク -->
    <a
      class="process-link-pc"
      href="process.png"
      aria-label="チョコレートができるまで"
      title="チョコレートができるまで"
    ></a>

    <!-- スマートフォン版リンク -->
    <a
      class="process-link-sp"
      href="sprocess.png"
      aria-label="チョコレートができるまで"
      title="チョコレートができるまで"
    ></a>

  </main>

</body>
</html>
